# Copy to dops.config.yml (gitignored) and adjust.
# No secrets here: SSH uses your key file or agent, and values like hosts can
# come from the environment with ${VAR}.

# The project's secrets file, read before ${VAR} is resolved (see .env.example).
# envFile: ~/.config/dops/shop.env

bastions:
  jump:
    host: ${DOPS_BASTION_HOST}
    user: ops
    identityFile: ~/.ssh/id_ed25519
    # passphraseEnv: DOPS_KEY_PASSPHRASE

targets:
  staging:
    host: 10.0.1.10
    user: deploy
    identityFile: ~/.ssh/id_ed25519
    bastion: jump
    path: /var/www/project
    environment: staging
  prod-web1:
    host: 10.0.2.11
    user: deploy
    agent: true
    bastion: jump
    path: /var/www/project
    environment: production
    production: true # dops run, exec and db pull ask for --yes
  prod-web2:
    host: 10.0.2.12
    user: deploy
    agent: true
    bastion: jump
    path: /var/www/project
    environment: production
    production: true

  # This machine: steps run in a local shell inside path.
  local:
    local: true
    path: ~/projects/shop
    environment: dev

# Multisite: values become {placeholders} with `dops run <pipeline> --site fr`.
sites:
  default:
    alias: '@self'
  fr:
    alias: '@fr'
    uri: fr.example.com

# Values steps can use as {name}. Missing ones are asked for at run time
# (dashboard form, or -p name=value on the command line).
params:
  branch:
    description: Git branch to deploy
    default: main
  module:
    description: Module machine name

pipelines:
  cache-clear:
    description: Rebuild Drupal caches for one site
    targets: [staging]
    steps:
      - name: Rebuild caches
        run: vendor/bin/drush {alias} cr

  deploy:
    description: Pull code, install dependencies, update the database and config
    targets: [prod-web1, prod-web2]
    steps:
      - name: Pull code
        run: git pull --ff-only
      - name: Install dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader
        timeoutSeconds: 900
      - name: Database updates
        run: vendor/bin/drush updb -y
      - name: Import configuration
        run: vendor/bin/drush cim -y
      - name: Rebuild caches
        run: vendor/bin/drush cr

  local-refresh:
    description: Rebuild the local DDEV site after pulling a branch
    targets: [local]
    steps:
      - name: Install dependencies
        run: ddev composer install
      - name: Database updates
        run: ddev drush updb -y
      - name: Import configuration
        run: ddev drush cim -y
      - name: Rebuild caches
        run: ddev drush cr

  enable-module:
    description: Enable a module and export the config change
    targets: [staging]
    steps:
      - name: Enable
        run: vendor/bin/drush {alias} en {module} -y
      - name: Export configuration
        run: vendor/bin/drush {alias} cex -y

visual:
  outputDir: .dops/visual
  viewport: { width: 1440, height: 900 }
  threshold: 0.1 # per-pixel colour tolerance
  maxDiffRatio: 0.001 # page counts as changed above 0.1 % differing pixels
  concurrency: 4 # browser tabs per capture
  hide: ['.messages', '.views-slideshow'] # dynamic bits that would always differ
  cacheBust: true # unique query parameter per capture, so Varnish serves fresh pages
  urlSets:
    demo:
      baseUrl: https://shop.ddev.site
      paths: [/, /user/login, /user/password]
    staging:
      baseUrl: https://staging.example.com
      paths: [/, /products, /cart]
      environments:
        prod: https://www.example.com
        stage: https://staging.example.com
      httpAuth:
        usernameEnv: TEST_HTTP_USER
        passwordEnv: TEST_HTTP_PASS

uiTests:
  outputDir: .dops/ui-tests
  suites:
    smoke:
      testDir: examples/ui-tests/smoke
      baseUrl: https://shop.ddev.site
      retries: 1
  schedules:
    - suite: smoke
      cron: '0 7 * * 1-5' # weekdays before stand-up
  notify:
    webhookEnv: DOPS_WEBHOOK_URL
