[project]
name = "dops-ai-review"
version = "0.1.0"
description = "AI review of git diffs and commits, with Jira context"
readme = "README.md"
license = "MIT"
authors = [{ name = "dimidjy", email = "dimidjy322@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1",
    "httpx>=0.28",
    "pydantic>=2.10",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
dops-ai = "dops_ai_review.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["dops_ai_review"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
